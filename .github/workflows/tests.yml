# Every test in this project is synthetic — fake bridges and `--demo`, never a
# MIDI port and never the K2000R (CLAUDE.md: one session drives the hardware at
# a time). So the whole suite runs on a hosted runner with no hardware and no
# ALSA sequencer, which is exactly what makes it worth running here: the drift
# this project keeps finding by hand is what a red build catches on the push
# that introduced it.
#
# The matrix is deliberately not Linux-only. This is developed on Linux, and the
# install path is the part most likely to be broken in a way the author's own
# machine can never show them. The sibling eosed added macOS and Windows and its
# first run found a config file that had silently never persisted on Windows for
# the life of that project. k2kremote now caches its window size the same way,
# under XDG_CACHE_HOME with a ~/.cache fallback, so `--print-size` below is
# there to exercise precisely that path on a platform where it is unusual.
#
# Linux sweeps every supported Python; macOS and Windows cover the ends of the
# range, which is also the wheel/no-wheel split: python-rtmidi 1.5.8 ships no
# cp313 wheel on any platform, so 3.13 exercises a from-source build.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # python-rtmidi is imported at module scope by k2kremote.midi_bridge, so
      # it has to be installed even though nothing here opens a port. On Linux
      # the ALSA headers are needed whenever pip falls back to a source build,
      # which is not the rare case it sounds like: there is no cp313 wheel, so
      # 3.13 builds from source every time. macOS and Windows need no
      # equivalent — CoreMIDI and WinMM are part of the OS SDK and the runners
      # ship the toolchain a source build needs.
      - name: Install ALSA headers (needed for any python-rtmidi source build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # `image` too: the pixel render mode is optional at runtime but its tests
      # skip silently without it, and a mode that only ever runs on the author's
      # kitty terminal is the one most likely to rot unnoticed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,image]"

      - name: Run the suite
        run: python -m pytest -q

      # Proves the console script is on PATH and runnable from the environment
      # the installer made — what the README's Quick Start promises, and the
      # thing that differs most between platforms (bin/ vs Scripts\).
      #
      # --print-size is not filler: it reads and writes the window-size cache
      # under XDG_CACHE_HOME, falling back to ~/.cache, which is a Linux-shaped
      # assumption being made on three platforms.
      # Documentation rot is mechanically checkable and was not being checked:
      # paths that moved when the macro editor became its own package, an anchor
      # that changed when a heading was reworded, images renamed. --offline so a
      # rate-limited URL cannot make this job flaky — a check people learn to
      # ignore is worse than no check.
      - name: Check documentation links
        run: python docs/check_links.py --offline

      - name: Smoke-test the entry points
        run: |
          k2kremote --help
          k2kremote --long-help
          k2kremote --print-size
          # k2kmaced ships as its own program: the macro editor runs with the
          # instrument switched off, so it is the half a user can exercise
          # without hardware — and the half most likely to break unnoticed on a
          # platform the author does not use.
          k2kmaced --help
          k2kmacli --help
          k2kmacli list tests/fixtures/BOOT.MAC

      # `ports` is the first command a new user runs, and until 2026-08-16 it
      # raised on any host with no MIDI backend — a container, a headless box, a
      # runner — because rtmidi throws from its *constructor* and every entry
      # point starts by enumerating. Both outcomes are legitimate here: a runner
      # may enumerate cleanly and return empty lists, or may have no sequencer
      # at all and say so. What is never acceptable is a traceback, so that is
      # what this asserts rather than the exit code.
      - name: '`ports` must fail kindly, or not at all'
        shell: bash
        run: |
          set +e
          output=$(python -m k2kremote.midi_bridge ports 2>&1)
          status=$?
          set -e
          echo "$output"
          if printf '%s' "$output" | grep -q 'Traceback'; then
            echo "::error::midi_bridge ports raised instead of exiting kindly"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::unexpected exit status $status"
            exit 1
          fi
